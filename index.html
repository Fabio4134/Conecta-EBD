<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta EBD</title>
    <link rel="icon" type="image/png" href="/logo-transparent.png" />
    <link rel="apple-touch-icon" href="/logo-transparent.png" />
    <meta name="theme-color" content="#10b981" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Força a remoção da Vercel Toolbar caso ela seja injetada
      const removeVercelToolbar = () => {
        const toolbar = document.querySelector('vercel-live') || document.querySelector('vercel-toolbar');
        if (toolbar) {
          toolbar.remove();
        }
      };
      
      // Verifica e remove periodicamente por alguns segundos após o carregamento
      setInterval(removeVercelToolbar, 500);
      setTimeout(() => clearInterval(removeVercelToolbar), 10000);
    </script>
  </body>
</html>
