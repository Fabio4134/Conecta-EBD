<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta EBD</title>
    <link rel="icon" type="image/png" href="/logo-transparent.png" />
    <link rel="apple-touch-icon" href="/logo-transparent.png" />
    <meta name="theme-color" content="#10b981" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Usa MutationObserver para remover a barra da Vercel instantaneamente assim que ela tentar ser injetada
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.tagName && (node.tagName.toLowerCase() === 'vercel-live' || node.tagName.toLowerCase() === 'vercel-toolbar')) {
              node.remove();
            } else if (node.id === 'vercel-toolbar' || node.className?.includes?.('vercel-toolbar')) {
              node.remove();
            }
          });
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
